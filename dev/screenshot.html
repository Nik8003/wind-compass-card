<!doctype html>
<!--
  Renders ONE card for a screenshot (used by dev/make-screenshots.ps1).
  URL parameters:
    c      card options as JSON (the sensors are added automatically)
    dir    wind direction in degrees      spd   wind speed (km/h)      rain  rain (mm/h)
    dark   1 = Home Assistant dark theme  lang  Home Assistant language (default en)
    w      card width in px (default 340) cardmod  CSS put inside ha-card, like card-mod does
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wind Compass Card - screenshot</title>
  <style>
    html, body { margin: 0; }
    body {
      font-family: Roboto, "Segoe UI", sans-serif; padding: 14px; display: inline-block;
      background: #f0f2f5; color: var(--primary-text-color);
      --primary-text-color: #212121; --secondary-text-color: #727272;
      --divider-color: #e0e0e0; --secondary-background-color: #f5f5f5;
      --card-background-color: #fff; --primary-color: #03a9f4;
      --warning-color: #ffa600; --error-color: #db4437; --info-color: #039be5;
    }
    body.dark {
      background: #111;
      --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b;
      --divider-color: #3a3a3a; --secondary-background-color: #262626;
      --card-background-color: #1c1c1c;
    }
  </style>
</head>
<body>
  <wind-compass-card id="card"></wind-compass-card>
  <script>
    customElements.define("ha-card", class extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: "open" }).innerHTML =
          "<style>:host{display:block;background:var(--card-background-color);border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.12)}</style><slot></slot>";
      }
    });
    // Stand-in for HA's <ha-icon>, drawing the real Material Design Icons from @mdi/js
    let mdiPaths = null;
    const mdiReady = import("https://cdn.jsdelivr.net/npm/@mdi/js@7.4.47/mdi.js").then((m) => (mdiPaths = m)).catch(() => (mdiPaths = {}));
    customElements.define("ha-icon", class extends HTMLElement {
      connectedCallback() { mdiReady.then(() => this.draw()); }
      draw() {
        const name = (this.getAttribute("icon") || "").replace(/^mdi:/, "");
        const key = "mdi" + name.split("-").map((p) => p[0].toUpperCase() + p.slice(1)).join("");
        const d = (mdiPaths && mdiPaths[key]) || "M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20z";
        this.innerHTML = `<svg viewBox="0 0 24 24" width="100%" height="100%"><path fill="currentColor" d="${d}"/></svg>`;
      }
    });
  </script>
  <script src="../dist/wind-compass-card.js"></script>
  <script>
    const q = new URLSearchParams(location.search);
    const card = document.getElementById("card");
    card.style.display = "block";
    card.style.width = (q.get("w") || "340") + "px";
    if (q.get("dark") === "1") document.body.classList.add("dark");
    const extra = q.get("c") ? JSON.parse(q.get("c")) : {};
    card.setConfig({
      direction_entity: "sensor.wind_direction",
      speed_entity: "sensor.wind_speed",
      ...(q.has("rain") ? { rain_entity: "sensor.rain_rate" } : {}),
      ...extra,
    });
    const lng = q.get("lang") || "en";
    card.hass = {
      language: lng, locale: { language: lng },
      states: {
        "sensor.wind_direction": { entity_id: "sensor.wind_direction", state: q.get("dir") || "30", attributes: { unit_of_measurement: "°" } },
        "sensor.wind_speed": { entity_id: "sensor.wind_speed", state: q.get("spd") || "20", attributes: { unit_of_measurement: "km/h" } },
        "sensor.rain_rate": { entity_id: "sensor.rain_rate", state: q.get("rain") || "0", attributes: { unit_of_measurement: "mm/h" } },
      },
    };
    if (q.get("cardmod")) {
      const haCard = card.shadowRoot.querySelector("ha-card");
      const st = document.createElement("style");
      st.textContent = q.get("cardmod");
      haCard.shadowRoot.appendChild(st);
    }
    // the screenshot script reads the page size from the title
    mdiReady.then(() => setTimeout(() => {
      const r = document.body.getBoundingClientRect();
      document.title = `size:${Math.ceil(r.width)}x${Math.ceil(r.height)}`;
    }, 300));
  </script>
</body>
</html>
